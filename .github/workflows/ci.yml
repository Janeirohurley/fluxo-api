name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fluxo:fluxo@localhost:5432/fluxo_ci
      SHADOW_DATABASE_URL: postgresql://fluxo:fluxo@localhost:5432/fluxo_ci_shadow
      ADMIN_APPROVAL_TOKEN: github-actions-demo-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm run prisma:generate

      - name: Build TypeScript
        run: pnpm run build

      - name: Run tests
        run: pnpm test
